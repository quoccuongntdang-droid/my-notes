<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖥️ Soạn Thảo Toàn Màn Hình -> GitHub</title>
    <link rel="icon" type="image/png" href="https://ahnsahnghong.com/wp-content/uploads/2021/07/church-of-god-established-by-ahnsahnghong.jpg">
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js" referrerpolicy="origin"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #eef2f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #1e293b;
            color: #fff;
            padding: 10px 16px;
            flex-wrap: wrap;
        }
        .meta-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 320px;
            flex-wrap: wrap;
        }
        .meta-inputs input {
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-size: 13px;
        }
        .folder-input { width: 140px; }
        .file-input { flex: 1; min-width: 180px; }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 6px;
            padding: 8px 13px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .btn-github { background: #2ea44f; }
        .btn-sync { background: #6f42c1; }
        .btn-close { background: #0366d6; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-strip {
            background: #f8fafc;
            border-bottom: 1px solid #cbd5e1;
            padding: 5px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            min-height: 18px;
        }
        .editor-wrap {
            height: calc(100vh - 82px);
            padding: 8px;
            box-sizing: border-box;
        }
        .tox-tinymce {
            height: 100% !important;
            border-radius: 8px !important;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="meta-inputs">
        <input type="text" id="editFolder" class="folder-input" placeholder="Thư mục (VD: posts)...">
        <input type="text" id="editFileName" class="file-input" placeholder="Tên file (VD: bai-viet.md)...">
    </div>
    <div class="actions">
        <button type="button" id="btnSaveGithub" class="btn btn-github" onclick="saveDirectToGitHub()">🚀 Lưu thẳng lên GitHub</button>
        <button type="button" class="btn btn-sync" onclick="syncToMain(false)">💾 Lưu nháp</button>
        <button type="button" class="btn btn-close" onclick="syncToMain(true)">↩️ Về trang chính</button>
    </div>
</div>

<div class="status-strip" id="editorStatus">Sẵn sàng soạn thảo toàn màn hình.</div>

<div class="editor-wrap">
    <textarea id="fullEditor"></textarea>
</div>

<script>
    const DRAFT_KEY = 'github_editor_draft_session';
    let originalFileName = '';

    function htmlToMarkdown(html) {
        let md = html;
        md = md.replace(/<h1>(.*?)<\/h1>/gi, '# $1\n\n');
        md = md.replace(/<h2>(.*?)<\/h2>/gi, '## $1\n\n');
        md = md.replace(/<h3>(.*?)<\/h3>/gi, '### $1\n\n');
        md = md.replace(/<strong>(.*?)<\/strong>/gi, '**$1**');
        md = md.replace(/<b>(.*?)<\/b>/gi, '**$1**');
        md = md.replace(/<em>(.*?)<\/em>/gi, '*$1*');
        md = md.replace(/<i>(.*?)<\/i>/gi, '*$1*');
        md = md.replace(/<p>(.*?)<\/p>/gi, '$1\n\n');
        md = md.replace(/<br\s*[\/]?>/gi, '\n');
        md = md.replace(/<[^>]+>/g, '');
        return md.trim();
    }

    function setStatus(msg, color = '#334155') {
        const el = document.getElementById('editorStatus');
        el.style.color = color;
        el.textContent = msg;
    }

    tinymce.init({
        selector: '#fullEditor',
        height: '100%',
        menubar: 'file edit view insert format tools table',
        plugins: 'anchor autolink charmap codesample emoticons fullscreen image link lists media searchreplace table visualblocks wordcount',
        toolbar: 'fullscreen undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table | align left center right justify | bullist numlist indent outdent | removeformat',
        language: 'vi',
        branding: false,
        setup: function(editor) {
            editor.on('init', function() {
                const raw = localStorage.getItem(DRAFT_KEY);
                if (raw) {
                    try {
                        const draft = JSON.parse(raw);
                        document.getElementById('editFolder').value = draft.folder || '';
                        document.getElementById('editFileName').value = draft.fileName || '';
                        originalFileName = draft.fileName || '';
                        editor.setContent(draft.content || '');
                        if (draft.fileName) {
                            document.title = `🖥️ ${draft.fileName}`;
                        }
                    } catch (e) {
                        console.error('Lỗi đọc bản nháp:', e);
                    }
                }
            });

            editor.on('change keyup', function() {
                syncStorageOnly(editor.getContent());
            });
        }
    });

    function syncStorageOnly(htmlContent) {
        const folder = document.getElementById('editFolder').value.trim();
        const fileName = document.getElementById('editFileName').value.trim();
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
            folder,
            fileName,
            content: htmlContent,
            updatedAt: Date.now()
        }));
    }

    function syncToMain(shouldClose) {
        const editor = tinymce.get('fullEditor');
        if (editor) {
            syncStorageOnly(editor.getContent());
        }
        if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'SYNC_EDITOR_CONTENT' }, '*');
        }
        if (shouldClose) {
            window.close();
        } else {
            setStatus('✅ Đã lưu nháp đồng bộ với trang chính.', '#2ea44f');
        }
    }

    async function saveDirectToGitHub() {
        const folder = document.getElementById('editFolder').value.trim();
        const fileName = document.getElementById('editFileName').value.trim();
        const editor = tinymce.get('fullEditor');
        const btn = document.getElementById('btnSaveGithub');

        if (!folder) {
            alert('Vui lòng nhập tên thư mục trên GitHub!');
            return;
        }
        if (!fileName) {
            alert('Vui lòng nhập tên file trước khi lưu lên GitHub!');
            return;
        }
        if (!editor) return;

        let contentToSend = editor.getContent();
        syncStorageOnly(contentToSend);

        if (fileName.endsWith('.md')) {
            contentToSend = htmlToMarkdown(contentToSend);
        }

        btn.disabled = true;
        setStatus(`⏳ Đang đẩy "${folder}/${fileName}" lên GitHub...`, '#0366d6');

        try {
            const response = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    folder,
                    fileName,
                    originalFileName: originalFileName || fileName,
                    content: contentToSend
                })
            });

            const result = await response.json();
            if (result.success) {
                originalFileName = fileName;
                document.title = `🖥️ ${fileName}`;
                setStatus(`🎉 ${result.message}`, '#2ea44f');
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'REFRESH_FROM_EDITOR', folder, fileName }, '*');
                }
            } else {
                setStatus(`❌ Lỗi: ${result.message}`, '#d73a49');
            }
        } catch (error) {
            setStatus(`❌ Lỗi kết nối: ${error.message}`, '#d73a49');
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
