<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs Cloud Mobile</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .container { flex: 1; display: flex; flex-direction: column; background: white; padding: 12px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 100%; }
        h2 { color: #333; font-size: 18px; text-align: center; margin: 0 0 10px 0; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #444; font-size: 13px; }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .btn { background: #0366d6; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:active { opacity: 0.8; }
        
        /* Khung chứa Google Docs iframe */
        .frame-container { flex: 1; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; margin-top: 5px; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #status { font-size: 12px; text-align: center; margin-top: 5px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Nhúng Google Docs Trực Tiếp</h2>

    <div class="form-group">
        <label>Dán Link Google Doc của bạn vào đây:</label>
        <div class="input-row">
            <input type="text" id="docLink" placeholder="https://docs.google.com/document/d/.../edit">
            <button class="btn" onclick="loadGoogleDoc()">Mở Docs</button>
        </div>
    </div>

    <div class="frame-container">
        <!-- Khung hiển thị Google Docs -->
        <iframe id="docsFrame" src="" allowfullscreen></iframe>
    </div>
    
    <div id="status">Mẹo: Hãy chia sẻ tài liệu Google Docs ở chế độ "Bất kỳ ai có đường liên kết đều có quyền chỉnh sửa" để nhúng mượt mà nhất.</div>
</div>

<script>
    // Tự động nhớ link Google Doc đã dùng gần nhất trên điện thoại
    window.onload = function() {
        const savedLink = localStorage.getItem('my_google_doc_link');
        if (savedLink) {
            document.getElementById('docLink').value = savedLink;
            setEmbedUrl(savedLink);
        }
    };

    function loadGoogleDoc() {
        let rawLink = document.getElementById('docLink').value.trim();
        if (!rawLink) {
            alert('Vui lòng dán link Google Docs!');
            return;
        }
        localStorage.setItem('my_google_doc_link', rawLink);
        setEmbedUrl(rawLink);
    }

    function setEmbedUrl(link) {
        // Chuyển đổi link Google Docs thông thường sang dạng nhúng (embedded=true)
        let embedUrl = link;
        if (link.includes('/edit')) {
            embedUrl = link.split('/edit')[0] + '/edit?embedded=true';
        } else if (!link.includes('embedded=true')) {
            embedUrl = link.replace(/\/$/, '') + '/edit?embedded=true';
        }
        
        document.getElementById('docsFrame').src = embedUrl;
    }
</script>

</body>
</html>
