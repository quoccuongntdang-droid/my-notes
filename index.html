<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Soạn Thảo Chuyên Nghiệp -> GitHub</title>
    <!-- Tích hợp TinyMCE (Trình soạn thảo chuẩn Word) -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js" referrerpolicy="origin"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 12px; box-sizing: border-box; }
        .container { max-width: 850px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #333; font-size: 20px; text-align: center; margin-top: 0; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fff; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { background: #2ea44f; color: white; border: none; flex: 1; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; min-width: 120px; }
        .btn-secondary { background: #0366d6; }
        .btn-warning { background: #d97706; }
        .btn-danger { background: #d73a49; }
        .btn:active { opacity: 0.8; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
        .move-box { background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>✍️ Trình Soạn Thảo & Quản Lý Thư Mục GitHub</h2>

    <!-- Chọn thư mục hiện tại dạng Dropdown -->
    <div class="form-group">
        <label>📁 Chọn Thư mục hiện tại:</label>
        <select id="folderSelect" onchange="onFolderChange()">
            <option value="">-- Đang tải danh sách thư mục... --</option>
        </select>
    </div>

    <div class="form-group">
        <label>📂 Chọn file có sẵn trong thư mục này:</label>
        <select id="fileSelect" onchange="loadSelectedFile()">
            <option value="">-- Chọn file cũ để sửa hoặc xem --</option>
        </select>
    </div>

    <div class="form-group">
        <label>Tên File:</label>
        <input type="text" id="fileName" placeholder="Nhập tên file...">
    </div>

    <div class="form-group">
        <label>Nội dung soạn thảo (Giao diện chuyên nghiệp):</label>
        <textarea id="myEditor"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn btn-secondary" onclick="newFile()">📄 Viết bài mới</button>
        <button class="btn" onclick="saveToGitHub()">🚀 Lưu lên GitHub</button>
        <button class="btn btn-danger" onclick="deleteFile()">🗑️ Xóa file</button>
    </div>

    <!-- Khối chuyển file sang thư mục khác bằng Dropdown -->
    <div class="move-box">
        <div class="form-group" style="margin-bottom: 10px;">
            <label style="color: #d97706;">➡️ Chuyển file này sang thư mục đích:</label>
            <select id="targetFolderSelect">
                <option value="">-- Chọn thư mục đích đến --</option>
            </select>
        </div>
        <button class="btn btn-warning" style="width: 100%;" onclick="moveFile()">📂 Xác nhận chuyển thư mục</button>
    </div>

    <div id="status"></div>
</div>

<script>
    tinymce.init({
        selector: '#myEditor',
        height: 420,
        menubar: 'file edit view insert format tools table',
        plugins: 'anchor autolink charmap codesample emoticons image link lists media searchreplace table visualblocks wordcount',
        toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table | align left center right justify | bullist numlist indent outdent | removeformat',
        language: 'vi',
        branding: false
    });

    // Vừa mở trang sẽ tải danh sách thư mục từ GitHub
    window.onload = function() {
        loadFoldersList();
    };

    // Hàm lấy danh sách các thư mục từ GitHub
    async function loadFoldersList() {
        try {
            const res = await fetch('/api/folders');
            const data = await res.json();
            
            const folderSelect = document.getElementById('folderSelect');
            const targetFolderSelect = document.getElementById('targetFolderSelect');
            
            folderSelect.innerHTML = '<option value="">-- Chọn thư mục --</option>';
            targetFolderSelect.innerHTML = '<option value="">-- Chọn thư mục đích đến --</option>';

            if (data.success && data.folders.length > 0) {
                data.folders.forEach(folder => {
                    // Đổ dữ liệu vào select thư mục hiện tại
                    const opt1 = document.createElement('option');
                    opt1.value = folder;
                    opt1.textContent = folder;
                    folderSelect.appendChild(opt1);

                    // Đổ dữ liệu vào select thư mục đích
                    const opt2 = document.createElement('option');
                    opt2.value = folder;
                    opt2.textContent = folder;
                    targetFolderSelect.appendChild(opt2);
                });

                // Mặc định chọn thư mục đầu tiên nếu có
                if (data.folders.includes('posts')) {
                    folderSelect.value = 'posts';
                } else {
                    folderSelect.value = data.folders[0];
                }
                loadFilesList();
            }
        } catch (err) {
            console.error('Lỗi tải danh sách thư mục:', err);
        }
    }

    // Khi thay đổi thư mục hiện tại
    function onFolderChange() {
        loadFilesList();
        newFile();
    }

    // Tải danh sách file trong thư mục đang chọn
    async function loadFilesList() {
        const folder = document.getElementById('folderSelect').value;
        const select = document.getElementById('fileSelect');
        select.innerHTML = '<option value="">-- Đang tải danh sách file... --</option>';

        if (!folder) return;

        try {
            const res = await fetch(`/api/files?folder=${encodeURIComponent(folder)}`);
            const data = await res.json();
            
            select.innerHTML = '<option value="">-- Chọn file cũ để sửa hoặc xem --</option>';
            if (data.success && data.files.length > 0) {
                data.files.forEach(file => {
                    const opt = document.createElement('option');
                    opt.value = file;
                    opt.textContent = file;
                    select.appendChild(opt);
                });
            }
        } catch (err) {
            console.error('Lỗi tải danh sách file:', err);
            select.innerHTML = '<option value="">-- Lỗi tải danh sách --</option>';
        }
    }

    // Mở file cũ để sửa
    async function loadSelectedFile() {
        const folder = document.getElementById('folderSelect').value;
        const fileName = document.getElementById('fileSelect').value;
        if (!fileName) return;

        document.getElementById('fileName').value = fileName;
        document.getElementById('status').style.color = '#005cc5';
        document.getElementById('status').innerText = `Đang tải nội dung file "${fileName}"...`;

        try {
            const res = await fetch(`/api/file?folder=${encodeURIComponent(folder)}&filename=${encodeURIComponent(fileName)}`);
            const data = await res.json();
            if (data.success) {
                tinymce.get('myEditor').setContent(data.content);
                document.getElementById('status').style.color = '#2ea44f';
                document.getElementById('status').innerText = `Đã mở thành công file "${fileName}"!`;
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('Lỗi tải nội dung file!');
        }
    }

    function newFile() {
        document.getElementById('fileName').value = '';
        document.getElementById('fileSelect').value = '';
        tinymce.get('myEditor').setContent('');
        document.getElementById('status').innerText = 'Đã sẵn sàng tạo file mới.';
    }

    // Lưu file lên GitHub
    async function saveToGitHub() {
        const folder = document.getElementById('folderSelect').value;
        const fileName = document.getElementById('fileName').value.trim();
        const selectedDropdownValue = document.getElementById('fileSelect').value;
        const originalFileName = selectedDropdownValue ? selectedDropdownValue : fileName;
        const statusDiv = document.getElementById('status');

        if (!folder) {
            alert('Vui lòng chọn thư mục!');
            return;
        }
        if (!fileName) {
            alert('Vui lòng nhập tên file!');
            return;
        }

        let contentToSend = tinymce.get('myEditor').getContent();

        statusDiv.style.color = '#005cc5';
        statusDiv.innerText = 'Đang đẩy dữ liệu lên GitHub...';

        try {
            const response = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folder, fileName, originalFileName, content: contentToSend })
            });

            const result = await response.json();
            if (result.success) {
                statusDiv.style.color = '#2ea44f';
                statusDiv.innerText = `🎉 ${result.message}`;
                loadFilesList();
            } else {
                statusDiv.style.color = '#d73a49';
                statusDiv.innerText = `❌ Lỗi: ${result.message}`;
            }
        } catch (error) {
            statusDiv.style.color = '#d73a49';
            statusDiv.innerText = `❌ Lỗi kết nối: ${error.message}`;
        }
    }

    // Xóa file
    async function deleteFile() {
        const folder = document.getElementById('folderSelect').value;
        const fileName = document.getElementById('fileName').value.trim();
        const statusDiv = document.getElementById('status');

        if (!fileName) {
            alert('Vui lòng chọn hoặc nhập tên file cần xóa!');
            return;
        }

        if (!confirm(`Bạn có chắc chắn muốn xóa vĩnh viễn file "${fileName}" không?`)) return;

        statusDiv.style.color = '#005cc5';
        statusDiv.innerText = `Đang xóa file "${fileName}"...`;

        try {
            const response = await fetch('/api/delete', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folder, fileName })
            });

            const result = await response.json();
            if (result.success) {
                statusDiv.style.color = '#2ea44f';
                statusDiv.innerText = `🗑️ ${result.message}`;
                newFile();
                loadFilesList();
            } else {
                statusDiv.style.color = '#d73a49';
                statusDiv.innerText = `❌ Lỗi: ${result.message}`;
            }
        } catch (error) {
            statusDiv.style.color = '#d73a49';
            statusDiv.innerText = `❌ Lỗi kết nối: ${error.message}`;
        }
    }

    // Chuyển file sang thư mục khác bằng option
    async function moveFile() {
        const currentFolder = document.getElementById('folderSelect').value;
        const fileName = document.getElementById('fileName').value.trim();
        const targetFolder = document.getElementById('targetFolderSelect').value;
        const statusDiv = document.getElementById('status');

        if (!fileName) {
            alert('Vui lòng chọn hoặc nhập tên file cần chuyển!');
            return;
        }

        if (!targetFolder) {
            alert('Vui lòng chọn thư mục đích đến!');
            return;
        }

        if (currentFolder === targetFolder) {
            alert('Thư mục đích phải khác thư mục hiện tại!');
            return;
        }

        if (!confirm(`Bạn có muốn chuyển file "${fileName}" sang thư mục "${targetFolder}" không?`)) return;

        statusDiv.style.color = '#005cc5';
        statusDiv.innerText = `Đang chuyển file sang "${targetFolder}"...`;

        try {
            const content = tinymce.get('myEditor').getContent();

            const response = await fetch('/api/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentFolder, targetFolder, fileName, content })
            });

            const result = await response.json();
            if (result.success) {
                statusDiv.style.color = '#2ea44f';
                statusDiv.innerText = `✨ ${result.message}`;
                // Chuyển luôn select thư mục hiện tại sang thư mục mới
                document.getElementById('folderSelect').value = targetFolder;
                loadFilesList();
            } else {
                statusDiv.style.color = '#d73a49';
                statusDiv.innerText = `❌ Lỗi: ${result.message}`;
            }
        } catch (error) {
            statusDiv.style.color = '#d73a49';
            statusDiv.innerText = `❌ Lỗi kết nối: ${error.message}`;
        }
    }
</script>

</body>
</html>
