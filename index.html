<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✍️ Quản Lý Ghi Chú GitHub</title>
    <link rel="icon" type="image/png" href="https://ahnsahnghong.com/wp-content/uploads/2021/07/church-of-god-established-by-ahnsahnghong.jpg">
    <!-- Tích hợp TinyMCE -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js" referrerpolicy="origin"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 12px; box-sizing: border-box; }
        .container { max-width: 850px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #333; font-size: 20px; text-align: center; margin-top: 0; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fff; }
        
        select[multiple] { height: 160px; padding: 6px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { background: #2ea44f; color: white; border: none; flex: 1; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; min-width: 120px; }
        .btn-secondary { background: #0366d6; }
        .btn-warning { background: #d97706; }
        .btn-danger { background: #d73a49; }
        .btn-info { background: #6f42c1; }
        .btn:active { opacity: 0.8; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
        .move-box { background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-top: 15px; }
        .note { font-size: 12px; color: #666; margin-top: 4px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>✍️ Trình Soạn Thảo & Quản Lý Thư Mục GitHub</h2>

    <!-- Ô nhập hoặc chọn thư mục hiện tại -->
    <div class="form-group">
        <label>📁 Thư mục hiện tại (Chọn có sẵn hoặc gõ tên thư mục mới):</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="folderInput" list="foldersList" placeholder="Nhập hoặc chọn thư mục..." onchange="onFolderChange()" oninput="onFolderChange()" style="flex: 1;">
            <button class="btn btn-info" style="flex: 0 0 160px; padding: 10px; font-size: 14px;" onclick="createNewFolder()">📁 Tạo thư mục mới</button>
        </div>
        <datalist id="foldersList"></datalist>
    </div>

    <div class="form-group">
        <label>📂 Chọn file có sẵn trong thư mục này (Có thể chọn nhiều file):</label>
        <select id="fileSelect" multiple onchange="loadSelectedFile()">
            <option value="">-- Đang tải danh sách file... --</option>
        </select>
        <div class="note">💡 Mẹo: Giữ phím <b>Ctrl</b> (Windows) hoặc <b>Cmd</b> (Mac) để chọn nhiều file. Chọn 1 file để mở và chỉnh sửa bên dưới.</div>
    </div>

    <div class="form-group">
        <label>Tên File (Dùng khi viết hoặc sửa 1 file):</label>
        <input type="text" id="fileName" placeholder="Nhập tên file...">
    </div>

    <div class="form-group">
        <label>Nội dung soạn thảo (Giao diện chuyên nghiệp):</label>
        <textarea id="myEditor"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn btn-secondary" onclick="newFile()">📄 Viết bài mới</button>
        <button class="btn" onclick="saveToGitHub()">🚀 Lưu lên GitHub</button>
        <button class="btn btn-danger" onclick="deleteFile()">🗑️ Xóa file đang chọn</button>
    </div>

    <!-- Khối chuyển file sang thư mục khác -->
    <div class="move-box">
        <div class="form-group" style="margin-bottom: 10px;">
            <label style="color: #d97706;">➡️ Chuyển các file đang chọn sang thư mục đích:</label>
            <input type="text" id="targetFolderInput" list="foldersList" placeholder="Nhập hoặc chọn thư mục đích đến...">
        </div>
        <button class="btn btn-warning" style="width: 100%;" onclick="moveMultipleFiles()">📂 Xác nhận chuyển các file đã chọn</button>
    </div>

    <div id="status"></div>
</div>

<script>
    tinymce.init({
        selector: '#myEditor',
        height: 420,
        menubar: 'file edit view insert format tools table',
        plugins: 'anchor autolink charmap codesample emoticons image link lists media searchreplace table visualblocks wordcount',
        toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table | align left center right justify | bullist numlist indent outdent | removeformat',
        language: 'vi',
        branding: false
    });

    window.onload = function() {
        loadFoldersList(true);
    };

    async function loadFoldersList(setDefault = false) {
        try {
            const res = await fetch('/api/folders');
            const data = await res.json();
            
            const datalist = document.getElementById('foldersList');
            datalist.innerHTML = '';

            if (data.success && data.folders.length > 0) {
                // Sắp xếp thư mục chuẩn số tự nhiên
                data.folders.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

                data.folders.forEach(folder => {
                    const opt = document.createElement('option');
                    opt.value = folder;
                    datalist.appendChild(opt);
                });

                const folderInput = document.getElementById('folderInput');
                if (setDefault && !folderInput.value) {
                    folderInput.value = data.folders.includes('posts') ? 'posts' : data.folders[0];
                    loadFilesList();
                }
            }
        } catch (err) {
            console.error('Lỗi tải danh sách thư mục:', err);
        }
    }

    async function createNewFolder() {
        const folder = document.getElementById('folderInput').value.trim();
        const statusDiv = document.getElementById('status');

        if (!folder) {
            alert('Vui lòng nhập tên thư mục mới cần tạo!');
            return;
        }

        statusDiv.style.color = '#005cc5';
        statusDiv.innerText = `Đang tạo thư mục mới "${folder}" trên GitHub...`;

        try {
            const response = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    folder: folder, 
                    fileName: 'bat-dau', 
                    originalFileName: 'bat-dau', 
                    content: `<p>Thư mục ${folder} đã được tạo thành công!</p>` 
                })
            });

            const result = await response.json();
            if (result.success) {
                statusDiv.style.color = '#2ea44f';
                statusDiv.innerText = `🎉 Đã tạo thành công thư mục "${folder}"!`;
                await loadFoldersList(false);
                await loadFilesList();
            } else {
                statusDiv.style.color = '#d73a49';
                statusDiv.innerText = `❌ Lỗi: ${result.message}`;
            }
        } catch (error) {
            statusDiv.style.color = '#d73a49';
            statusDiv.innerText = `❌ Lỗi kết nối: ${error.message}`;
        }
    }

    function onFolderChange() {
        loadFilesList();
    }

    async function loadFilesList() {
        const folder = document.getElementById('folderInput').value.trim();
        const select = document.getElementById('fileSelect');
        select.innerHTML = '<option value="">-- Đang tải danh sách file... --</option>';

        if (!folder) {
            select.innerHTML = '<option value="">-- Chọn thư mục trước --</option>';
            return;
        }

        try {
            const res = await fetch(`/api/files?folder=${encodeURIComponent(folder)}`);
            const data = await res.json();
            
            select.innerHTML = '';
            if (data.success && data.files.length > 0) {
                // Sắp xếp file chuẩn số tự nhiên (1.1, 1.2, ..., 1.10...)
                data.files.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

                data.files.forEach(file => {
                    const opt = document.createElement('option');
                    opt.value = file;
                    opt.textContent = file;
                    select.appendChild(opt);
                });
            } else {
                select.innerHTML = '<option value="">-- Thư mục chưa có file nào --</option>';
            }
        } catch (err) {
            console.error('Lỗi tải danh sách file:', err);
            select.innerHTML = '<option value="">-- Thư mục chưa có file nào --</option>';
        }
    }

    async function loadSelectedFile() {
        const folder = document.getElementById('folderInput').value.trim();
        const select = document.getElementById('fileSelect');
        const selectedOptions = Array.from(select.selectedOptions);

        if (selectedOptions.length === 1) {
            const fileName = selectedOptions[0].value;
            if (!fileName) return;

            document.getElementById('fileName').value = fileName;
            document.getElementById('status').style.color = '#005cc5';
            document.getElementById('status').innerText = `Đang tải nội dung file "${fileName}"...`;

            try {
                const res = await fetch(`/api/file?folder=${encodeURIComponent(folder)}&filename=${encodeURIComponent(fileName)}`);
                const data = await res.json();
                if (data.success) {
                    let fileContent = data.content;

                    // Nếu file có đuôi .md, chuyển đổi cú pháp Markdown sang HTML để hiển thị đẹp mắt
                    if (fileName.endsWith('.md')) {
                        fileContent = markdownToHtml(fileContent);
                    }

                    tinymce.get('myEditor').setContent(fileContent);
                    document.getElementById('status').style.color = '#2ea44f';
                    document.getElementById('status').innerText = `Đã mở thành công file "${fileName}"!`;
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Lỗi tải nội dung file!');
            }
        } else if (selectedOptions.length > 1) {
            document.getElementById('status').style.color = '#005cc5';
            document.getElementById('status').innerText = `Đã chọn ${selectedOptions.length} file. Bạn có thể bấm chuyển hoặc xóa.`;
        }
    }

    // Hàm chuyển đổi Markdown sang HTML để hiển thị lên TinyMCE
    function markdownToHtml(md) {
        let html = md;
        html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/\n\n/g, '</p><p>');
        html = '<p>' + html + '</p>';
        return html;
    }

    // Hàm chuyển đổi HTML từ TinyMCE sang Markdown sạch sẽ khi lưu file .md
    function htmlToMarkdown(html) {
        let md = html;
        md = md.replace(/<h1>(.*?)<\/h1>/gi, '# $1\n\n');
        md = md.replace(/<h2>(.*?)<\/h2>/gi, '## $1\n\n');
        md = md.replace(/<h3>(.*?)<\/h3>/gi, '### $1\n\n');
        md = md.replace(/<strong>(.*?)<\/strong>/gi, '**$1**');
        md = md.replace(/<b>(.*?)<\/b>/gi, '**$1**');
        md = md.replace(/<em>(.*?)<\/em>/gi, '*$1*');
        md = md.replace(/<i>(.*?)<\/i>/gi, '*$1*');
        md = md.replace(/<p>(.*?)<\/p>/gi, '$1\n\n');
        md = md.replace(/<br\s*[\/]?>/gi, '\n');
        md = md.replace(/<[^>]+>/g, '');
        return md.trim();
    }

    function newFile() {
        document.getElementById('fileName').value = '';
        document.getElementById('fileSelect').selectedIndex = -1;
        tinymce.get('myEditor').setContent('');
        document.getElementById('status').innerText = 'Đã sẵn sàng tạo file mới.';
    }

    async function saveToGitHub() {
        const folder = document.getElementById('folderInput').value.trim();
        const fileName = document.getElementById('fileName').value.trim();
        const select = document.getElementById('fileSelect');
        const selectedOptions = Array.from(select.selectedOptions);
        const originalFileName = (selectedOptions.length === 1) ? selectedOptions[0].value : fileName;
        const statusDiv = document.getElementById('status');

        if (!folder) {
            alert('Vui lòng nhập hoặc chọn tên thư mục!');
            return;
        }
        if (!fileName) {
            alert('Vui lòng nhập tên file!');
            return;
        }

        let contentToSend = tinymce.get('myEditor').getContent();

        // Nếu file có đuôi .md, tự động convert sang Markdown chuẩn trước khi đẩy lên Git
        if (fileName.endsWith('.md')) {
            contentToSend = htmlToMarkdown(contentToSend);
        }

        statusDiv.style.color = '#005cc5';
        statusDiv.innerText = 'Đang đẩy dữ liệu lên GitHub...';

        try {
            const response = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folder, fileName, originalFileName, content: contentToSend })
            });

            const result = await response.json();
            if (result.success) {
                statusDiv.style.color = '#2ea44f';
                statusDiv.innerText = `🎉 ${result.message}`;
                await loadFoldersList(false);
                await loadFilesList();
            } else {
                statusDiv.style.color = '#d73a49';
                statusDiv.innerText = `❌ Lỗi: ${result.message}`;
            }
        } catch (error) {
            statusDiv.style.color = '#d73a49';
            statusDiv.innerText = `❌ Lỗi kết nối: ${error.message}`;
        }
    }

    async function deleteFile() {
        const folder = document.getElementById('folderInput').value.trim();
        const select = document.getElementById('fileSelect');
        const selectedOptions = Array.from(select.selectedOptions);
        const statusDiv = document.getElementById('status');

        if (selectedOptions.length === 0) {
            alert('Vui lòng chọn ít nhất một file cần xóa!');
            return;
        }

        const fileNames = selectedOptions.map(opt => opt.value);

        if (!confirm(`Bạn có chắc chắn muốn xóa vĩnh viễn ${fileNames.length} file đã chọn không?`)) return;

        statusDiv.style.color = '#005cc5';
        statusDiv.innerText = `Đang xóa ${fileNames.length} file...`;

        try {
            let successCount = 0;
            for (let fileName of fileNames) {
                const response = await fetch('/api/delete', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folder, fileName })
                });
                const result = await response.json();
                if (result.success) successCount++;
            }

            statusDiv.style.color = '#2ea44f';
            statusDiv.innerText = `🗑️ Đã xóa thành công ${successCount}/${fileNames.length} file!`;
            newFile();
            await loadFoldersList(false);
            await loadFilesList();
        } catch (error) {
            statusDiv.style.color = '#d73a49';
            statusDiv.innerText = `❌ Lỗi kết nối: ${error.message}`;
        }
    }

    async function moveMultipleFiles() {
        const currentFolder = document.getElementById('folderInput').value.trim();
        const select = document.getElementById('fileSelect');
        const selectedOptions = Array.from(select.selectedOptions);
        const targetFolder = document.getElementById('targetFolderInput').value.trim();
        const statusDiv = document.getElementById('status');

        if (selectedOptions.length === 0) {
            alert('Vui lòng chọn ít nhất một file để chuyển!');
            return;
        }

        if (!targetFolder) {
            alert('Vui lòng nhập hoặc chọn thư mục đích đến!');
            return;
        }

        if (currentFolder === targetFolder) {
            alert('Thư mục đích phải khác thư mục hiện tại!');
            return;
        }

        const fileNames = selectedOptions.map(opt => opt.value);

        if (!confirm(`Bạn có muốn chuyển ${fileNames.length} file sang thư mục "${targetFolder}" không?`)) return;

        statusDiv.style.color = '#005cc5';
        statusDiv.innerText = `Đang tiến hành chuyển ${fileNames.length} file sang "${targetFolder}"...`;

        try {
            const response = await fetch('/api/move-multiple', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentFolder, targetFolder, fileNames })
            });

            const result = await response.json();
            if (result.success) {
                statusDiv.style.color = '#2ea44f';
                statusDiv.innerText = `✨ ${result.message}`;
                
                document.getElementById('folderInput').value = targetFolder;
                
                await loadFoldersList(false);
                await loadFilesList();
            } else {
                statusDiv.style.color = '#d73a49';
                statusDiv.innerText = `❌ Lỗi: ${result.message}`;
            }
        } catch (error) {
            statusDiv.style.color = '#d73a49';
            statusDiv.innerText = `❌ Lỗi kết nối: ${error.message}`;
        }
    }
</script>

</body>
</html>
